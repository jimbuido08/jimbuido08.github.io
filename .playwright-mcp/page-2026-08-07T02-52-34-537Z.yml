      - paragraph [ref=f1e40]: About
      - heading "From the ward to the workspace." [level=2] [ref=f1e41]
      - generic [ref=f1e42]:
        - paragraph [ref=f1e43]: I'm James Imbuido, a Data Scientist and AI Engineer based in Victoria, Australia. I build in Python and R, ship dashboards in Tableau and Power BI, and I don't trust a number until I've checked it twice.
        - paragraph [ref=f1e44]: Before this I worked for four years as a Registered Nurse in Victorian hospitals — most recently as a mental-health case manager in Maroondah, and earlier through pediatric oncology and ICU rotations at Dandenong Hospital, where I learned to synthesize clinical data across teams and act on it under precision pressure. I'm an MSc Data Science graduate (Distinction), and I'm currently an Associate Data Scientist at Commonwealth Bank — designing activity-linking pipelines and shipping GenFolio into production across the AI Powered Engineering stream.
